[package]
name = "cleric-rs"
version = "0.1.0"
edition = "2021"
description = "Native, dependency-free EQ healer bot: screen-region HP-bar reading + log-driven input"

[[bin]]
name = "cleric"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dependencies.windows-sys]
version = "0.59"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
]

[profile.release]
opt-level = 3
lto = true
strip = true
